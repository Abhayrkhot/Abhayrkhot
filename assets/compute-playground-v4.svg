<text class="name-final" x="35" y="223" fill="#f8f3e9" font-size="112" font-weight="900" letter-spacing="-7">ABHAY</text>
<text class="name-final" x="35" y="328" fill="url(#ink)" font-size="112" font-weight="900" letter-spacing="-7">KHOT<tspan fill="#ff9478">.</tspan></text>
<text x="35" y="328" fill="#fa59c8" font-size="112" font-weight="900" letter-spacing="-7" class="glitch">KHOT.</text>
<text x="44" y="377" fill="#e3dbea" font-size="23">Small tokens. Big systems.</text>
<text x="44" y="408" fill="#a49aaf" font-size="17">A little obsessed with what happens under the hood.</text>
