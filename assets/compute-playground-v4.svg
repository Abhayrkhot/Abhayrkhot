<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Abhay Khot — welcome to the compute playground</title><desc id="desc">Animated neon playground with orbiting tokens, a pulsing compute core, a scrolling technology ticker, and a terminal.</desc>
<defs>
