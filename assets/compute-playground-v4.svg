<text x="60" y="524" class="mono" fill="#baff7b" font-size="15">$ cat interests.txt</text>
<text x="60" y="552" class="mono" fill="#e1d7ec" font-size="14">inference / GPUs / distributed systems</text>
<text x="60" y="580" class="mono" fill="#ac9bbc" font-size="14">&gt; build. break. understand. repeat.</text><rect x="366" y="568" width="8" height="15" fill="#baff7b" class="blink"/>
<text x="638" y="518" class="mono" font-size="12" letter-spacing="3" fill="#b9a8ca">ALWAYS IN THE LOOP</text>
<text x="638" y="551" font-size="24" fill="#f4ecff" font-weight="bold">Curiosity → Code → Chaos</text>
<text x="638" y="582" font-size="15" fill="#a99ab8">The good kind of infinite loop.</text>
