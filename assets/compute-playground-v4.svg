<radialGradient id="halo"><stop stop-color="#8746ff" stop-opacity=".45"/><stop offset="1" stop-color="#8746ff" stop-opacity="0"/></radialGradient>
<linearGradient id="ink" x2="1" y2="1"><stop stop-color="#f6ff80"/><stop offset=".48" stop-color="#b7ff6a"/><stop offset="1" stop-color="#62fbe0"/></linearGradient>
