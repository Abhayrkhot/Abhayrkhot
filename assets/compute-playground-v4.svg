<rect x="40" y="34" width="203" height="30" rx="15" fill="#262330"/><circle cx="57" cy="49" r="4" fill="#baff71" class="pulse"/><text x="71" y="54" class="mono" font-size="12" fill="#dbd5e7">abhay@compute : ~</text>
<text x="954" y="54" class="mono" font-size="12" letter-spacing="2" fill="#b8a8cc">EST. IN CURIOSITY</text>
