<style>
.name-final{animation:reveal 10s steps(1) infinite}.name-scramble{animation:scramble 10s steps(1) infinite}.decode-done{animation:reveal 10s steps(1) infinite}@keyframes reveal{0%,22%{opacity:0}23%,100%{opacity:1}}@keyframes scramble{0%,22%{opacity:1}23%,100%{opacity:0}}

text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace}.orbit{transform-origin:905px 295px;animation:spin 18s linear infinite}.reverse{animation-direction:reverse;animation-duration:26s}.float{animation:float 4s ease-in-out infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}.blink{animation:blink 1s steps(2,end) infinite}.run{stroke-dasharray:8 16;animation:dash 2s linear infinite}.ticker{animation:ticker 18s linear infinite}.bar{transform-box:fill-box;transform-origin:bottom;animation:bars 1.4s ease-in-out infinite alternate}.glitch{animation:glitch 6s steps(1) infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-12px)}}@keyframes pulse{50%{opacity:.45}}@keyframes blink{50%{opacity:0}}@keyframes dash{to{stroke-dashoffset:-96}}@keyframes ticker{to{transform:translateX(-1100px)}}@keyframes bars{to{transform:scaleY(.25)}}@keyframes glitch{0%,94%,100%{transform:translate(0);opacity:0}95%{transform:translate(5px,-2px);opacity:.7}97%{transform:translate(-4px,2px);opacity:.5}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.glitch,.name-scramble{display:none}.name-final,.decode-done{opacity:1}}
@keyframes frame0{0%,0.00%{opacity:0}0.01%,4.50%{opacity:1}4.51%,100%{opacity:0}}
